    <!-- Formulário de Atendimento -->

    <div class="container my-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-8">

                <div class="card shadow-sm p-4" style="background-color: #FFFFFF;">
                    <h3 class="mb-4">Cadastro de Atendimento</h3>

                    <form>

                        <div class="row g-3">

                            <div class="col-sm-6">
                                <label class="form-label">Nome</label>
                                <input type="text" class="form-control" placeholder="Digite seu nome" required>
                            </div>

                            <div class="col-sm-6">
                                <label class="form-label">Sobrenome</label>
                                <input type="text" class="form-control" placeholder="Digite seu sobrenome" required>
                            </div>

                            <div class="col-sm-6">
                                <label class="form-label">Telefone / WhatsApp</label>

                                <div class="input-group">
                                    <span class="input-group-text">+55</span>
                                    <input type="tel" class="form-control" placeholder="(00) 00000-0000" required>
                                </div>
                            </div>

                            <div class="col-sm-6">
                                <label class="form-label">E-mail</label>
                                <div class="input-group">
                                    <span class="input-group-text">@</span>
                                    <input type="email" class="form-control" placeholder="exemplo@email.com" required>
                                </div>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Tipo de Serviço</label>

                                <select class="form-select" required>
                                    <option value="" selected disabled>
                                        Escolha um serviço...
                                    </option>

                                    <option value="manutencao">Manutenção</option>
                                    <option value="conserto">Conserto</option>
                                    <option value="avaliacao">Avaliação</option>
                                    <option value="consulta">Consulta</option>
                                    <option value="outro">Outro</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Valor Estimado</label>

                                <div class="input-group">
                                    <span class="input-group-text">R$</span>
                                    <input type="number" class="form-control" placeholder="0,00" min="0" step="0.01">
                                </div>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Observações</label>

                                <textarea class="form-control" rows="4"
                                    placeholder="Descreva o problema ou serviço desejado..."></textarea>
                            </div>

                            <div class="col-12">
                                <div class="form-check">
                                    <input type="checkbox" id="termos" class="form-check-input" required>

                                    <label for="termos" class="form-check-label">
                                        Confirmo que as informações fornecidas estão corretas.
                                    </label>
                                </div>
                            </div>

                            <div class="col-12 mt-4">
                                <button class="btn w-100"
                                    style="background-color: #A9BCEB; border-color: #A9BCEB; color: #263653;"
                                    type="submit">
                                    Cadastrar Atendimento
                                </button>
                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
